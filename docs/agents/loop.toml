# Issue-to-PR loop configuration for THIS repo (thinkweave).
#
# Read by the `devloop` rail (`python scripts/issue_loop.py config`) and the
# /issue-loop command (orchestration). The rail is the `devloop` package,
# pinned from funloops (issue #151); its docs, and every `*.command.md`
# referenced below, live in funloops under packages/devloop/docs/agents/.
# Semantics: that repo's issue-loop.md. The knobs and their defaults are the
# ones in loop.toml.template beside it; the rail refuses a key it does not
# know, by name, on both paths.
#
# This file holds the repo's facts only (dec-6c3539b2): the gates and test
# command, labels, triage paths, branch prefix, baseline rule and dispatch
# role shapes. The person's settings (issues per run, fix rounds, training
# mode, run mode, delivery, tdd.mode, [prime], dispatch transports and
# models) are not here: they resolve to devloop's defaults, or, when the
# rsi-rail repo is configured, to its devloop/loop.toml, which devloop layers
# over this file and which may carry nothing else. Adding one of them here
# reds tests/test_devloop_boundaries.py. See docs/agents/README.md
# (thinkweave#334, #346).
#
# Per-run settings belong on the command line, not in edits to this file:
# every scalar knob can be overridden for one run via
# `--set [section.]key=value` (section defaults to loop), with /issue-loop
# sugar `--stacked` and `--max-issues <n>`. Gates are file-only by design.

[loop]
branch_prefix = "loop/issue-"
require_green_baseline = true   # red suite on main → refuse to implement (fix the baseline issue first)

[labels]
runnable = "ready-for-agent"
claimed = "agent-claimed"
on_gate_failure = "ready-for-human"

# ── Risk-lane triage ──────────────────────────────────────────────────────
# After all gates pass, the rail classifies the shipped PR yellow (a human
# skims) or red (a human must look). The rail CLASSIFIES; the orchestrator
# applies the label. Red wins; every triggered rule is reported.
[triage]
# Sensitive paths → always red, whatever the size or judge verdict. Three
# pattern forms: dir prefix (trailing '/'), bare basename (matches at any
# depth), glob (*/?/[ — matched against the basename). Thinkweave's layout:
# the hooks, the CLI+MCP surface (surfaces/mcp/ holds the MCP tool-signature
# files), the ontology + sources config by basename, any schema.
sensitive_paths = [
    "hooks/",
    "src/thinkweave/surfaces/",
    "ontology.yaml",
    "sources.yaml",
    "*schema*",
]
# Watched paths → yellow with the path named (skim, never gate). docs/agents/
# is the judgment plane: loop.toml and a constitution overlay live there, and
# a change steers every future run.
watched_paths = ["docs/agents/"]
red_diff_lines = 800           # "big diff" → red (a human-lane signal, never a block)

# ── Dispatch roles ────────────────────────────────────────────────────────
# How `devloop pack` shapes each role's dispatch file. writer: persona +
# standing orders; reader: neither; shape: the stack-tip shape posture.
# Which agent runs a role (transport, harness, model, effort, args) is the
# person's setting: the rail's devloop/loop.toml, default agent-tool.
[dispatch.implementer]
posture = "writer"

[dispatch.judge]
posture = ["reader", "shape"]

# ── Gate pipeline ─────────────────────────────────────────────────────────
# Ordered, and the order is the contract: the deterministic guards run first,
# then the one judge. kinds: command | diff (deterministic, run by the
# rail) — judge (LLM-judged, run by the command in a fresh subagent context). A gate carries only the keys its kind
# reads; anything else is refused by name.

[[gates]]
id = "diff-guard"
kind = "diff"
required = true
# same three pattern forms as [triage].sensitive_paths above. A
# forbidden-paths check only: no line cap.
forbidden_paths = [".github/workflows/", "dist/", "_old/"]

[[gates]]
id = "tests"
kind = "command"
required = true
cmd = "uv run --extra mcp pytest -x -q"
timeout_sec = 1200

# The one judgment stage: a fresh judge returns criteria[] verdicts against
# the issue's acceptance criteria plus advisory findings[]. Fails iff a
# criterion is not-met; findings never block.
[[gates]]
id = "judge"
kind = "judge"
required = true
