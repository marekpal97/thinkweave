# Issue-to-PR loop configuration for THIS repo (thinkweave).
#
# Read by the `devloop` rail (`python scripts/issue_loop.py config`) and the
# /issue-loop command (orchestration). The rail is the `devloop` package,
# pinned from funloops (issue #151); its docs, and every `*.command.md`
# referenced below, live in funloops under packages/devloop/docs/agents/.
# Semantics: that repo's issue-loop.md. The knobs and their defaults are the
# ones in loop.toml.template beside it; the rail refuses a key it does not
# know, by name, on both paths.
#
# Per-run posture belongs on the command line, not in edits to this file:
# every knob in [loop]/[labels]/[tdd]/[triage] can be overridden for one run
# via `--set [section.]key=value` (section defaults to loop), with /issue-loop
# sugar `--stacked` and `--max-issues <n>`. Gates are file-only by design.

[loop]
max_issues_per_run = 3   # token guardrail: issues processed per invocation
max_parallel = 1         # frontier width dispatched concurrently (>1 = worktrees)
max_fix_rounds = 2       # implement→gates→fix iterations before routing to human; never extended mid-run
training_mode = true     # pause for human approval before push/PR; flip when trusted
branch_prefix = "loop/issue-"
require_green_baseline = true   # red suite on main → refuse to implement (fix the baseline issue first)
run_mode = "pass"        # pass: one frontier pass | exhaust: re-plan until dry
delivery = "pr-per-issue"  # pr-per-issue | stacked (one branch, one final PR)

[tdd]
# auto: TDD is ENFORCED in implementer standing orders iff the per-run
#       baseline probe (tests gate on the pristine worktree) is green.
# always / never: override the probe.
mode = "auto"

[labels]
runnable = "ready-for-agent"
claimed = "agent-claimed"
on_gate_failure = "ready-for-human"

# ── Risk-lane triage ──────────────────────────────────────────────────────
# After all gates pass, the rail classifies the shipped PR yellow (a human
# skims) or red (a human must look). The rail CLASSIFIES; the orchestrator
# applies the label. Red wins; every triggered rule is reported.
[triage]
# Sensitive paths → always red, whatever the size or judge verdict. Three
# pattern forms: dir prefix (trailing '/'), bare basename (matches at any
# depth), glob (*/?/[ — matched against the basename). Thinkweave's layout:
# the hooks, the CLI+MCP surface (surfaces/mcp/ holds the MCP tool-signature
# files), the ontology + sources config by basename, any schema.
sensitive_paths = [
    "hooks/",
    "src/thinkweave/surfaces/",
    "ontology.yaml",
    "sources.yaml",
    "*schema*",
]
# Watched paths → yellow with the path named (skim, never gate). docs/agents/
# is the judgment plane: loop.toml and a constitution overlay live there, and
# a change steers every future run.
watched_paths = ["docs/agents/"]
red_min_diff_lines = 800       # "big diff" → red (a human-lane signal, never a block)

# ── Gate pipeline ─────────────────────────────────────────────────────────
# Ordered, and the order is the contract: the deterministic guards run first,
# then the one judge, then the applying trim. kinds: command | diff
# (deterministic, run by the rail) — judge | simplify (LLM-judged, run by the
# command in fresh subagent contexts). A gate carries only the keys its kind
# reads; anything else is refused by name.

[[gates]]
id = "diff-guard"
kind = "diff"
required = true
# same three pattern forms as [triage].sensitive_paths above. A
# forbidden-paths check only: no line cap.
forbidden_paths = [".github/workflows/", "dist/", "_old/"]

[[gates]]
id = "tests"
kind = "command"
required = true
cmd = "uv run --extra mcp pytest -x -q"
timeout_sec = 1200

# The one judgment stage: a fresh judge returns criteria[] verdicts against
# the issue's acceptance criteria plus advisory findings[]. Fails iff a
# criterion is not-met per `threshold`; findings never block.
[[gates]]
id = "judge"
kind = "judge"
required = true
threshold = "all"        # all | majority — of the issue's acceptance criteria

# simplify runs LAST and is safe by construction: it can only SHRINK an
# already-verified diff. The orchestrator snapshots the tip, applies the
# subagent's delete-list, re-runs `rerun`, and hard-resets to the snapshot if
# it goes red — so required=false is literal: its failure mode is a revert,
# not a block. Stacked delivery runs it once, at the stack tip.
[[gates]]
id = "simplify"
kind = "simplify"
required = false
skill = "ponytail-review"          # ships with devloop (funloops); host /simplify is the fallback
rerun = ["tests"]                  # re-verify the shrunk diff against these gate ids, in order; no second judge
revert_note = "⚠ simplify-reverted"  # PR-body note when the shrunk diff is discarded
