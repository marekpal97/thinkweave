# Packaged default for the `prompt_gate` decision site: before a coding agent
# reads the user's prompt, decide which vault notes are worth showing it. A
# rail copy at thinkweave/questions/prompt_gate.toml replaces this file whole.
# Slots: {prompt}, {previous_prompt}, {task}; per candidate, {candidate}.
state = """
A user works with a coding agent that can read notes from the user's personal
knowledge vault. The user just sent this prompt:
{prompt}

The user's previous prompt in this session:
{previous_prompt}

The task the session is working on:
{task}
"""

[questions.helps]
type = "noul"
per_subject = true
instructions = """Would showing this vault note to the agent help it with the user's prompt? \
Note: {candidate}"""
